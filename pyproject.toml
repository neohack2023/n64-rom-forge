[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "n64-rom-forge"
version = "0.1.0"
description = "Evidence-governed N64 reverse-engineering substrate"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
n64rf = "n64rf.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
